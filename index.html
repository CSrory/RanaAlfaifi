<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rana Alfaifi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1e;--bg2:#0d1428;--card:#111a34;--ink:#eef1fa;--mute:#98a3c2;--line:#1f2b4f;--accent:#8473ff;--accent2:#5b86ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.85}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:5;background:rgba(10,15,30,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.links{display:flex;gap:22px}
.links a{color:var(--mute);text-decoration:none;font-size:15px}
.links a:hover{color:var(--ink)}
.logo{font-weight:700;direction:ltr;color:var(--ink)}
button{font:inherit;cursor:pointer}
#lang{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 14px}
#lang:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{padding:56px 0 64px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hi{display:inline-block;background:rgba(132,115,255,.14);color:var(--accent);border-radius:6px;padding:0 12px;font-size:14px}
h1{font-size:clamp(28px,4.6vw,44px);line-height:1.35;margin:14px 0 6px}
.role{font-size:19px;margin:0}
.uni{color:var(--mute);margin:0 0 14px}
.tag-line{color:var(--mute);max-width:46ch;margin:0 0 24px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 20px}
.btn.main{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.pic{position:relative;width:min(340px,86%);aspect-ratio:1;margin:0 auto}
.pic::before{content:"";position:absolute;inset:-6% -6% 6% 6%;border-radius:50%;background:linear-gradient(135deg,var(--accent),#4b3fd1)}
.pic img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:60% 45%;border:4px solid var(--bg)}
.code{position:absolute;bottom:-4%;inset-inline-start:-14%;direction:ltr;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--mute)}
.code b{color:#f0a36b;font-weight:400}
section.s{padding:56px 0;border-top:1px solid var(--line)}
section.alt{background:var(--bg2)}
h2{font-size:26px;margin:0 0 20px}
.about p{max-width:70ch;color:#cfd6ea;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.item h3{margin:0;font-size:18px}
.meta{color:var(--mute);font-size:14px}
.item p{margin:8px 0 0;color:#cfd6ea}
.item a,.foot a{color:var(--accent)}
.tech{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tech span{background:rgba(132,115,255,.14);color:var(--accent);border-radius:6px;padding:0 10px;font-size:13px}
.foot{padding:40px 0;text-align:center;border-top:1px solid var(--line);color:var(--mute)}
@media (max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.tag-line{margin-inline:auto}.btns{justify-content:center}.links{display:none}.code{display:none}.pic{order:-1}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
const D = window.PORTFOLIO;
const UI = {
  ar: {hi:"مرحبًا، أنا", about:"نبذة عني", interests:"الاهتمامات", projects:"المشاريع", experience:"الخبرات", hackathons:"الهاكاثونات", certificates:"الشهادات", contact:"تواصل", open:"الرابط", mail:"راسليني", other:"English"},
  en: {hi:"Hi, I'm", about:"About", interests:"Interests", projects:"Projects", experience:"Experience", hackathons:"Hackathons", certificates:"Certificates", contact:"Contact", open:"Link", mail:"Email me", other:"العربية"}
};
let lang = "ar";
try { lang = localStorage.getItem("lang") || "ar"; } catch (e) {}
const t = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] ?? v.en ?? v.ar ?? "") : (v ?? "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ext = (u, label) => u ? ` <a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : "";
const has = a => Array.isArray(a) && a.length;

function block(id, title, body, alt) {
  return `<section class="s ${alt ? "alt" : ""}" id="${id}"><div class="wrap"><h2>${title}</h2>${body}</div></section>`;
}
function render() {
  const u = UI[lang], c = D.contact || {};
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t(D.name);
  const secs = [];
  secs.push(["about", u.about]);
  if (has(D.interests)) secs.push(["interests", u.interests]);
  [["projects"], ["experience"], ["hackathons"], ["certificates"]].forEach(([k]) => has(D[k]) && secs.push([k, u[k]]));
  const nav = `<nav><div class="wrap"><span class="logo">${esc([...(D.name.en || "R")][0])}.</span>
    <div class="links">${secs.map(([id, l]) => `<a href="#${id}">${l}</a>`).join("")}</div>
    <button id="lang" type="button">${u.other}</button></div></nav>`;
  const focus = (D.interests || []).slice(0, 3).map(i => `"${esc(i.en)}"`).join(", ");
  const btns = [
    c.email && `<a class="btn main" href="mailto:${esc(c.email)}">${u.mail}</a>`,
    c.github && `<a class="btn" href="${esc(c.github)}" target="_blank" rel="noopener">GitHub</a>`,
    c.x && `<a class="btn" href="${esc(c.x)}" target="_blank" rel="noopener">X</a>`,
    c.linkedin && `<a class="btn" href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`
  ].filter(Boolean).join("");
  const hero = `<header class="wrap hero"><div>
      <span class="hi">${u.hi}</span><h1>${esc(t(D.name))}</h1>
      <p class="role">${esc(t(D.role))}</p><p class="uni">${esc(t(D.university))}</p>
      <p class="tag-line">${esc(t(D.tagline))}</p><div class="btns">${btns}</div></div>
    <div class="pic"><img src="${esc(D.photo)}" alt="${esc(t(D.name))}">
      <div class="code" aria-hidden="true">const rana = {<br>&nbsp;&nbsp;focus: [${focus}],<br>&nbsp;&nbsp;year: <b>4</b><br>};</div></div></header>`;
  let body = block("about", u.about, `<div class="about">${(t(D.about) || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>`, true);
  if (has(D.interests)) body += block("interests", u.interests, `<div class="chips">${D.interests.map(i => `<span class="chip">${esc(t(i))}</span>`).join("")}</div>`);
  const cards = (k, fn) => has(D[k]) ? block(k, u[k], `<div class="grid">${D[k].map(fn).join("")}</div>`, k === "experience" || k === "certificates") : "";
  body += cards("projects", p => `<div class="item"><h3>${esc(t(p.title))}${ext(p.link, u.open)}</h3><p>${esc(t(p.description))}</p>${has(p.tech) ? `<div class="tech">${p.tech.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}</div>`);
  body += cards("experience", e => `<div class="item"><h3>${esc(t(e.role))}</h3><div class="meta">${esc(t(e.place))} · ${esc(t(e.period))}</div><p>${esc(t(e.description))}</p></div>`);
  body += cards("hackathons", h => `<div class="item"><h3>${esc(t(h.title))}</h3><div class="meta">${esc(t(h.result))} · ${esc(t(h.date))}</div><p>${esc(t(h.description))}</p></div>`);
  body += cards("certificates", x => `<div class="item"><h3>${esc(t(x.title))}${ext(x.link, u.open)}</h3><div class="meta">${esc(t(x.issuer))} · ${esc(t(x.date))}</div></div>`);
  const foot = `<footer class="foot"><div class="wrap">${btns || esc(t(D.name))}</div></footer>`;
  document.getElementById("app").innerHTML = nav + hero + body + foot;
  document.getElementById("lang").onclick = () => {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem("lang", lang); } catch (e) {}
    render();
  };
}
render();
</script>
</body>
</html>
